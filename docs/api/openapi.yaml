          maxLength: 100
      - in: query
        name: cidade
        schema:
          type: string
          maxLength: 100
      - in: query
        name: disponivel
        schema:
          type: boolean
      - in: query
        name: ong_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: ordering
        schema:
          enum:
          - -criada_em
          - data_fim
          - titulo
          type: string
          minLength: 1
        description: |-
          * `-criada_em` - -criada_em
          * `data_fim` - data_fim
          * `titulo` - titulo
      - in: query
        name: page
