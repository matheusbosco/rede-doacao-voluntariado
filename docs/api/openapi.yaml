openapi: 3.0.3
info:
  title: DAI — API v1
  version: 1.0.0
  description: ONGs, campanhas e contribuições declaradas. Sessão Django e CSRF nas
    mutações. Nenhum pagamento é processado.
paths:
  /api/v1/admin/ongs/:
    get:
      operationId: listar_ongs_para_analise_da_equipe
      description: 'Erros seguem o envelope erro{codigo,mensagem,campos}. Campos e
        queries desconhecidos são rejeitados. Corpo JSON: até 64 KiB. Limites: leitura
        pública 60/min por IP, sessão 120/min, escrita 30/min por usuário; login 5/min
        por IP+username e cadastro 5/min por IP.'
      summary: Listar ONGs para análise da equipe
      parameters:
      - in: query
        name: ordering
        schema:
          enum:
          - criada_em
          - nome
          type: string
          minLength: 1
        description: |-
          * `criada_em` - criada_em
          * `nome` - nome
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - pendente
          - aprovada
          - recusada
          type: string
          default: pendente
          minLength: 1
        description: |-
          * `pendente` - Pendente
          * `aprovada` - Aprovada
          * `recusada` - Recusada
      tags:
      - Administração
      security:
      - sessao: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOngPrivada'
              examples:
                RespostaDeSucesso:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: 1
                      nome: Amigos
                      descricao: Apoio social
                      causa: Educação
                      email_contato: contato@example.org
                      telefone: ''
                      site: ''
                      endereco:
                        cep: '01001000'
                        logradouro: Praça da Sé
                        numero: '10'
                        complemento: ''
                        bairro: Sé
                        cidade: São Paulo
                        uf: SP
                      instrucoes_recebimento: Agende a entrega.
                      cnpj: null
                      status: pendente
                      motivo_analise: ''
                      criada_em: '2026-10-06T10:00:00-03:00'
                      atualizada_em: '2026-10-06T10:00:00-03:00'
                  summary: Resposta de sucesso
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
              examples:
                ErroDeValidação:
                  value:
                    erro:
                      codigo: validacao
                      mensagem: Confira os campos informados.
                      campos:
                        campo:
                        - Campo desconhecido ou protegido.
                  summary: Erro de validação
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Segundos até permitir nova tentativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResposta'
          description: ''
  /api/v1/admin/ongs/{id}/analise/:
