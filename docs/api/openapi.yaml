        name: id
        schema:
          type: integer
        required: true
      tags:
      - Administração
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnaliseEntrada'
            examples:
              Requisição:
                value:
                  decisao: recusar
                  motivo: Confira o endereço.
        required: true
      security:
      - sessao: []
        csrf: []
      responses:
