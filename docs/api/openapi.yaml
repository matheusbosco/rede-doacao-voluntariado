          * `PE` - PE
          * `PI` - PI
          * `RJ` - RJ
          * `RN` - RN
          * `RS` - RS
          * `RO` - RO
          * `RR` - RR
          * `SC` - SC
          * `SP` - SP
          * `SE` - SE
          * `TO` - TO
