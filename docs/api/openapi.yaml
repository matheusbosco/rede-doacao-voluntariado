          - PI
          - RJ
          - RN
          - RS
          - RO
          - RR
          - SC
          - SP
          - SE
          - TO
          type: string
          minLength: 1
        description: |-
          * `AC` - AC
          * `AL` - AL
          * `AP` - AP
          * `AM` - AM
          * `BA` - BA
          * `CE` - CE
          * `DF` - DF
          * `ES` - ES
          * `GO` - GO
          * `MA` - MA
          * `MT` - MT
          * `MS` - MS
          * `MG` - MG
