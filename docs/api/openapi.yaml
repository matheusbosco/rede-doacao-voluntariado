        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCampanhaResposta'
              examples:
                RespostaDeSucesso:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: 1
