<rect x="70" y="1050" width="2090" height="175" rx="0" fill="#F5F8FE" stroke="#CBD5E1" stroke-width="1"/>
<text x="94" y="1090" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#1D4ED8">DA CONTRIBUIÇÃO AO RESULTADO</text>
<text x="94" y="1130" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#223047">Usuário envia a ajuda → servidor confere os dados → banco guarda o registro como declarada.</text>
<text x="94" y="1161" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#223047">Responsável verifica o recebimento. Apenas confirmadas entram no total; transferências são externas.</text>
<text x="94" y="1192" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#223047">Endereço pode ser preenchido sem a consulta de CEP.</text>
<text x="70" y="1287" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#52647A">Caixas com estereótipos: nós, ambientes e componentes UML. Setas indicam quem inicia a comunicação.</text>
<text x="2185" y="1320" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="end" fill="#52647A">Django / Render / PostgreSQL no Neon / ViaCEP</text>
