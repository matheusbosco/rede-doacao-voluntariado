{% extends "base.html" %}
{% block titulo %}Análise de ONGs{% endblock %}
{% block conteudo %}
<h1>ONGs pendentes de análise</h1>
<div class="cartoes">
  {% for ong in ongs %}
    <article class="cartao">
      <h2><a href="{% url 'ong-detalhe' ong.pk %}">{{ ong.nome }}</a></h2>
      <p>{{ ong.cidade }}/{{ ong.uf }}</p>
      <form method="post" action="{% url 'admin-ong-analise' ong.pk %}">
        {% csrf_token %}
        <label for="motivo-{{ ong.pk }}">Motivo (obrigatório para recusar)</label>
        <textarea id="motivo-{{ ong.pk }}" name="motivo" maxlength="500" rows="3"></textarea>
        <p><button type="submit" name="decisao" value="aprovar">Aprovar</button>
        <button class="negativo" type="submit" name="decisao" value="recusar">Recusar</button></p>
      </form>
    </article>
  {% empty %}<p>Nenhuma ONG pendente de análise.</p>{% endfor %}
</div>
{% endblock %}
