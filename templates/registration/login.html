{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
<form class="cartao" method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<p class="erro" role="alert">Usuário ou senha incorretos.</p>{% endif %}
  <label for="{{ form.username.id_for_label }}">Usuário</label>
  {{ form.username }}
  <label for="{{ form.password.id_for_label }}">Senha</label>
  {{ form.password }}
  <p><button type="submit">Entrar</button></p>
  <p class="ajuda">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</form>
{% endblock %}
